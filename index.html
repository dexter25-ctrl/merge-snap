<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Merge &amp; Snap - V2 Premium</title>
    <meta name="description" content="Merge &amp; Snap - Le jeu de fusion photo premium. Fusionnez vos appareils photo et montez en niveau !">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- =============================================
     ÉCRAN 1 : CHARGEMENT (Loading Screen)
     Affiché en premier, disparaît après 3.5s
     ============================================= -->
<div id="loading-screen">
    <img src="assets/decor_perso/new_demmarage.png" alt="Merge &amp; Snap - Chargement" class="loading-bg">
    <div class="film-strip-container">
        <div class="film-strip-bar">
            <div class="film-perforations"></div>
            <div class="film-progress"></div>
            <div class="film-perforations"></div>
        </div>
        <p class="loading-text">DÉVELOPPEMENT EN COURS...</p>
    </div>
</div>

<!-- =============================================
     ÉCRAN 2 : MENU PRINCIPAL (NOUVEAU)
     Affiché après le chargement. Présente les
     personnages avec une animation "coucou" et
     la barre de navigation principale.
     ============================================= -->
<div id="main-menu">

    <!-- Logo et titre -->
    <div class="main-menu-header">
        <h1 class="main-menu-logo">📸 Merge &amp; Snap</h1>
        <p class="main-menu-subtitle">L'Atelier Photo</p>
    </div>

    <!-- Personnages qui font coucou -->
    <div class="main-menu-characters">
        <div class="character-figure">
            <span class="character-wave">👋</span>
            <img src="assets/decor_perso/femme_dressing.png" alt="Personnage féminin">
        </div>
        <div class="character-figure">
            <span class="character-wave">👋</span>
            <img src="assets/decor_perso/homme_1_dressing.png" alt="Personnage masculin">
        </div>
    </div>

    <!-- Barre de navigation du bas -->
    <nav class="main-menu-navbar" aria-label="Navigation principale">

        <!-- Bouton principal -->
        <button class="btn-play-story" id="btn-play-story" onclick="goToSaveMenu()">
            🎬 Jouer à l'histoire
        </button>

        <!-- Boutons secondaires -->
        <div class="main-menu-secondary-btns">
            <button class="btn-secondary-menu" id="btn-vestiaire" onclick="showComingSoon('Vestiaire')">
                <span>👗</span><span>Vestiaire</span>
            </button>
            <button class="btn-secondary-menu" id="btn-autres-modes" onclick="showComingSoon('Autres Modes')">
                <span>🎮</span><span>Autres modes</span>
            </button>
            <button class="btn-secondary-menu" id="btn-boutique" onclick="showComingSoon('Boutique')">
                <span>🛍️</span><span>Boutique</span>
            </button>
            <button class="btn-secondary-menu" id="btn-parametres" onclick="showComingSoon('Paramètres')">
                <span>⚙️</span><span>Paramètres</span>
            </button>
        </div>

    </nav>
</div>

<!-- =============================================
     ÉCRAN 3 : MENU CASIER (Sélection Sauvegarde)
     Affiche les 3 slots de sauvegarde sur le
     fond du casier photo.
     ============================================= -->
<div id="start-menu" class="overlay-menu" style="display:none;">
    <div class="menu-box" style="background:transparent;border:none;box-shadow:none;">
        <div class="menu-title" style="display:none;">Merge &amp; Snap</div>
        <div id="save-slots-container"
             style="display:flex;flex-direction:column;justify-content:space-evenly;width:100%;height:100%;">
            <!-- Slots générés dynamiquement par JS (renderMainMenu) -->
        </div>
    </div>
</div>

<!-- =============================================
     ÉCRAN 4 : CRÉATION DE PERSONNAGE
     Fond dressing, choix du nom et du genre.
     ============================================= -->
<div id="character-creator" style="display:none;">

    <h2 style="display:none;">Créez votre Photographe</h2>

    <!-- Affichage du personnage 3D -->
    <div id="character-display"
         style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.8);
                width:100%;height:50vh;max-height:450px;perspective:1000px;z-index:1;">
        <img id="body-layer"   src="./assets/decor_perso/homme_1_dressing.png"
             style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);
                    width:auto;height:100%;object-fit:contain;z-index:1;transform-origin:bottom center;">
        <img id="bottom-layer" src=""
             style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);
                    width:auto;height:100%;object-fit:contain;z-index:10;transform-origin:bottom center;">
        <img id="top-layer"    src=""
             style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);
                    width:auto;height:100%;object-fit:contain;z-index:20;transform-origin:bottom center;">
        <img id="hair-layer"   src=""
             style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);
                    width:auto;height:100%;object-fit:contain;z-index:30;transform-origin:bottom center;">
    </div>

    <!-- Formulaire de création -->
    <div style="position:absolute;bottom:0;left:0;width:100%;padding:20px;padding-bottom:40px;
                box-sizing:border-box;border-radius:30px 30px 0 0;z-index:100;
                display:flex;flex-direction:column;align-items:center;gap:10px;">

        <input type="text" id="player-name-input" placeholder="Votre Nom"
               style="padding:10px;margin:10px;border-radius:5px;border:none;">

        <div class="gender-select" style="display:flex;justify-content:space-between;margin-bottom:20px;gap:10px;">
            <button class="gender-btn male"   id="btn-gender-homme"  onclick="selectGender('homme', this)">Homme</button>
            <button class="gender-btn female" id="btn-gender-femme"  onclick="selectGender('femme', this)">Femme</button>
        </div>

        <!-- Sélecteur de style (cheveux / haut / bas) -->
        <div style="display:flex;flex-direction:column;gap:10px;margin:20px 0;width:80%;max-width:300px;">
            <div style="display:flex;justify-content:space-between;align-items:center;
                        background:rgba(0,0,0,0.5);padding:10px;border-radius:5px;">
                <button style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">&lt;</button>
                <span style="color:white;font-weight:bold;">Cheveux</span>
                <button style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">&gt;</button>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;
                        background:rgba(0,0,0,0.5);padding:10px;border-radius:5px;">
                <button style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">&lt;</button>
                <span style="color:white;font-weight:bold;">Haut</span>
                <button style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">&gt;</button>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;
                        background:rgba(0,0,0,0.5);padding:10px;border-radius:5px;">
                <button style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">&lt;</button>
                <span style="color:white;font-weight:bold;">Bas</span>
                <button style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">&gt;</button>
            </div>
        </div>

        <button id="btn-validate-creation"
                style="background-color:#f39c12;color:#fff;padding:15px 30px;font-size:18px;
                       border:none;border-radius:6px;font-weight:bold;cursor:pointer;
                       box-shadow:0 4px 6px rgba(0,0,0,0.3);"
                onclick="validateCreation()">VALIDER MON HÉROS</button>

        <button style="margin-top:10px;background:transparent;border:none;
                       text-decoration:underline;color:#bdc3c7;cursor:pointer;"
                onclick="backToMenu()">Retour</button>
    </div>
</div>

<!-- =============================================
     ÉCRAN 5 : JEU PRINCIPAL
     Contient le HUD, les missions, la grille et
     les contrôles.
     ============================================= -->
<div id="game-ui" class="app-container" style="display:none;width:100%;height:100%;flex-direction:column;align-items:center;position:relative;">

    <!-- === HUD / En-tête === -->
    <header id="game-header">
        <!-- Niveau + Barre XP -->
        <div class="header-item"
             style="display:flex;flex-direction:column;justify-content:center;align-items:center;
                    transform:translate(-28px,-19.9px);width:75px;">
            <span id="ui-level"
                  style="font-size:15px;font-weight:900;color:white;text-shadow:1px 1px 2px black;
                         text-align:center;line-height:1.1;">LVL 1</span>
            <div style="position:relative;width:100%;height:19px;background:rgba(0,0,0,0.5);
                        border-radius:50px;margin-top:3px;overflow:hidden;">
                <div id="ui-xp-fill"
                     style="width:45%;height:100%;
                            background:linear-gradient(90deg,#f1c40f,#f39c12,#f1c40f);
                            box-shadow:inset 0 1px 2px rgba(255,255,255,0.4);"></div>
                <span id="ui-xp-text"
                      style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
                             font-size:10px;color:#ecf0f1;font-weight:bold;
                             text-shadow:1px 1px 2px black;z-index:2;white-space:nowrap;">45 / 100</span>
            </div>
        </div>

        <!-- Énergie -->
        <div class="header-item" style="transform:translate(-30px,-2px);">
            <img src="assets/icones/icon_eclair.png"
                 style="width:29px;height:19px;margin-right:4px;object-fit:contain;">
            <div style="display:flex;flex-direction:column;align-items:center;line-height:1;">
                <span id="ui-energy"       style="font-size:12px;color:white;text-shadow:1px 1px 2px black;">100</span>
                <span id="ui-energy-timer" style="font-size:9px;color:#f1c40f;font-weight:bold;text-shadow:1px 1px 1px black;">MAX</span>
            </div>
        </div>

        <!-- Pièces -->
        <div class="header-item" style="transform:translate(-21px,-2px);">
            <img src="assets/icones/icon_piece.png"
                 style="width:28px;height:18px;margin-right:4px;object-fit:contain;">
            <span id="ui-coins" style="font-size:16px;color:white;text-shadow:1px 1px 2px black;">0</span>
        </div>

        <!-- Diamants -->
        <div class="header-item" style="transform:translate(-3px,-1px);">
            <img src="assets/icones/icon_diamant.png"
                 style="width:26px;height:16px;margin-right:4px;object-fit:contain;">
            <span id="ui-gems" style="font-size:16px;color:white;text-shadow:1px 1px 2px black;">0</span>
        </div>
    </header>

    <!-- === Zone Missions (clients) === -->
    <section id="mission-area" aria-label="Missions en cours"></section>

    <!-- === Confettis (récompense niveau) === -->
    <div class="confetti-container" id="confetti" aria-hidden="true"></div>

    <!-- === Grille de Jeu === -->
    <main id="grid-area">
        <div class="studio-container">
            <div class="grid" id="grid">
                <!-- Cellules générées par JS (initGrid) -->
            </div>
        </div>
    </main>

    <!-- === Contrôles bas de page === -->
    <footer id="game-footer">
        <button class="control-btn" id="inventory-btn" onclick="openInventory()">
            📦 <br><span style="font-size:10px;">Stock</span>
        </button>
        <button onclick="localStorage.clear(); window.location.reload();"
                style="padding:10px 20px;background:#e74c3c;color:white;border:none;
                       border-radius:5px;cursor:pointer;font-size:14px;font-weight:bold;
                       box-shadow:0 4px 6px rgba(0,0,0,0.3);">🔄 Reset Save</button>
    </footer>

    <!-- === Modal Inventaire === -->
    <div id="inventory-modal">
        <div class="inventory-header">
            <span>📦 Stockage Studio</span>
            <button class="inventory-close" onclick="closeInventory()">✕</button>
        </div>
        <div class="inventory-content">
            <div class="inventory-grid" id="inventory-grid">
                <!-- 160 slots générés par JS -->
            </div>
        </div>
        <button id="buy-slots-btn" onclick="buyInventorySlots()"
                style="margin-top:15px;width:100%;padding:10px;background-color:#27ae60;
                       color:white;border:none;border-radius:8px;font-weight:bold;
                       cursor:pointer;font-size:16px;">Acheter +8 cases (100 💎)</button>
    </div>

    <!-- === Message toast flottant === -->
    <div id="message" role="alert" aria-live="polite"></div>

</div><!-- #game-ui -->

<!-- Script principal -->
<script src="script.js"></script>

</body>
</html>
